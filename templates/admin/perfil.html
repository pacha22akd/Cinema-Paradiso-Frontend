{% extends 'admin/admin_base.html' %}
{% block title %}Perfil admin{% endblock %}
{% block admin_content %}
<h1>Perfil de administrador</h1>
<div class="panel panel-grande" style="max-width:520px">
  <form method="POST" action="#">
    <div class="campo"><label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" value="{{ admin.nombre }}" required></div>
    <div class="campo"><label for="email">Correo</label>
      <input type="email" id="email" name="email" value="{{ admin.email }}" required></div>
    <div class="campo">
  <label for="password">Nueva contraseña</label>
  <div class="campo-password">
    <input type="password" id="password" name="password" placeholder="Dejala vacía para no cambiarla" minlength="6" autocomplete="new-password">
    <button type="button" class="boton boton-borde boton-chico" data-mostrar-password="password">Mostrar</button>
  </div>
</div>
  </form>
</div>
{% endblock %}
