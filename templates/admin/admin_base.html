{% extends 'base.html' %}
{% block main %}
<div class="contenedor">
  <div class="admin-layout">
    <aside class="admin-menu">
      {# request.endpoint es el nombre de la ruta actual; sirve para marcar el link activo #}
      <a class="{% if request.endpoint == 'admin.perfil' %}activo{% endif %}" href="{{ url_for('admin.perfil') }}">Perfil</a>
      <a class="{% if request.endpoint == 'admin.dashboard' %}activo{% endif %}" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
      <a class="{% if request.endpoint == 'admin.peliculas' %}activo{% endif %}" href="{{ url_for('admin.peliculas') }}">Películas</a>
      <a class="{% if request.endpoint == 'admin.servicios' %}activo{% endif %}" href="{{ url_for('admin.servicios') }}">Servicios</a>
    </aside>
    <div class="admin-contenido">
      {% include 'components/mensajes.html' %}
      {% block admin_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
