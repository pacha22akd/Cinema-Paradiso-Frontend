{% extends 'base.html' %}
{% block title %}Editar perfil{% endblock %}
{% block content %}
<h1>Editar perfil</h1>
<div class="panel panel-grande" style="max-width:520px">
  <form method="POST" action="{{ url_for('publico.editar_perfil') }}">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
    </div>
    <div class="campo">
      <label for="apellido">Apellido</label>
      <input type="apellido" id="apellido" name="apellido" value="{{ usuario.apellido }}" required>
    <div class="campo">
      <label for="num_telefono">Numero de Telefono</label>
      <input type="num_telefono" id="num_telefono" name="num_telefono" value="{{ usuario.num_telefono }}" required>
    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
    <div class="campo">
  <label for="password">Nueva contraseña</label>
  <div class="campo-password">
    <input type="password" id="password" name="password" placeholder="Dejala vacía para no cambiarla" minlength="6" autocomplete="new-password">
    <button type="button" class="boton boton-borde boton-chico" data-mostrar-password="password">Mostrar</button>
  </div>
</div>
    </div>
    <button class="boton boton-rojo" type="submit">Guardar cambios</button>
    <a class="boton boton-borde" href="{{ url_for('publico.perfil') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
